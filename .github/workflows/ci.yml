# CI checks — runs on PRs and manual dispatch.
# Lint / typecheck / unit test / build. No deploy, no AWS credentials.
# Production deploy lives in deploy.yml.

name: ci

# A merge to main used to run this AND deploy.yml, which repeats the identical
# lint/typecheck/test/build gate before shipping. Dropping the `push` trigger
# removes the duplicate without weakening anything: a direct push to main is
# still gated, by deploy.yml, which refuses to ship if the gate fails.
on:
  pull_request:
  workflow_dispatch:

# One CI run per PR at a time — superseded pushes are cancelled instead of
# burning a full run each.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
